services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./logs:/srv/logs"]
  ui:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment: ["API_URL=http://api:8000"]
    ports: ["8501:8501"]
    depends_on: [api]
